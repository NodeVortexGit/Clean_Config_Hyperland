[Unit]
# seatd is only a fallback for libseat now (logind is preferred and works at
# real boot), but if it is ever used it must already be running.
After=seatd.service
Wants=seatd.service

[Service]
# Five restarts in 7s was enough to hit the start limit and drop to no login
# screen at all. Give it room to retry.
RestartSec=2
StartLimitBurst=10
