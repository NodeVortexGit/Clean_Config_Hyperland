# Minimal compositor for the login screen. One client, no decoration, no
# keybinds - anything more is attack surface on a screen shown pre-auth.
monitor = , preferred, auto, 1

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_hyprland_qtutils_check = true
    background_color = 0x000000
}

# If the greeter dies, take the compositor down with it so greetd restarts the
# whole thing rather than leaving a black screen with no way in.
exec-once = qs -p /usr/share/caelestia-greeter >>/var/log/greetd-greeter.log 2>&1; hyprctl dispatch exit
