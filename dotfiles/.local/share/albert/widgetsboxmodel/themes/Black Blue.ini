[window]
window_background_brush=#cc0a0a12
window_border_brush=#ff3b5bd9
input_background_brush=#ff000000
input_border_brush=#ff3b5bd9
input_trigger_color=#6b9bff
input_hint_color=#6a7290
result_item_selection_background_brush=#803b5bd9
result_item_selection_border_brush=#ff3b5bd9
result_item_selection_text_color=#ffffff
result_item_selection_subtext_color=#c7d0ff
result_item_text_color=#d8dcea
