; Black + dark-blue theme for Albert.
; base = the search bar background (black); text = input text + CURSOR (blue).

[palette]
base=#000000
text=#7aa2f7
window=#0a0a12
window_text=#d8dcea
button=#12121c
button_text=#d8dcea
highlight=#3b5bd9
highlight_text=#ffffff
placeholder_text=#6a7290
link=#6b9bff
