################################################################################
# Hyprland config (traditional format).
#
# Converted from hyprland.lua because Hyprland 0.56's EXPERIMENTAL Lua config
# registers keybinds as "__lua" dispatchers that never fire on a real keypress
# (verified: binds showed up in `hyprctl binds`, Super was mod 64, no submap,
# yet nothing happened). Native `bind = ...` in this .conf works reliably.
#
# The old hyprland.lua is kept as hyprland.lua.disabled. Hyprland loads .lua in
# preference to .conf when it exists, so that file MUST stay renamed for this
# config to take effect.
################################################################################

################
### MONITORS ###
################
# name, resolution, position, scale
monitor = , 1920x1080@60, auto, 1.0


###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = dolphin
$menu = albert toggle
$mainMod = SUPER


#################
### AUTOSTART ###
#################
# exec-once runs once at login (not on reload), so no duplicate-guard needed.
exec-once = qs -c caelestia
exec-once = albert


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Route Qt apps (Albert, etc.) through the dark GTK palette so they're not white.
env = QT_QPA_PLATFORMTHEME,gtk3


#####################
### LOOK AND FEEL ###
#####################
general {
    # Small gaps so the rounded glass corners are actually visible.
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    col.active_border = rgba(3b5bd9ee) rgba(2e49aeee) 45deg
    col.inactive_border = rgba(12121aaa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2

    # Glossy / aero glass: every window translucent + blurred behind.
    active_opacity = 0.85
    inactive_opacity = 0.76

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.25
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    # If the lockscreen client crashes, let a new one recover the lock instead
    # of leaving the session stuck locked.
    allow_session_lock_restore = true
}


#############
### INPUT ###
#############
input {
    kb_layout = us,bg
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# three-finger horizontal swipe to change workspaces
gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################
# --- YOUR CUSTOM BINDS ---
# Tap Meta alone -> toggle the island's expanded view (NOT the app-search
# launcher; Albert on Meta+Left-Alt is the app searcher).
bindr = $mainMod, SUPER_L, global, caelestia:islandToggle
# Any Meta+<key> combo fires launcherInterrupt, which cancels the island tap on
# Meta release -- so tapping Meta ALONE opens the island, but Meta+key combos do
# not. (Hyprland runs every bind that matches a combo, so these coexist with the
# real action binds on the same keys below.)
bind = $mainMod, Shift_L, global, caelestia:launcherInterrupt
bind = $mainMod, Control_L, global, caelestia:launcherInterrupt
bind = $mainMod, Alt_L, global, caelestia:launcherInterrupt
bind = $mainMod, Space, global, caelestia:launcherInterrupt
bind = $mainMod, Q, global, caelestia:launcherInterrupt
bind = $mainMod, Return, global, caelestia:launcherInterrupt
bind = $mainMod, E, global, caelestia:launcherInterrupt
bind = $mainMod, V, global, caelestia:launcherInterrupt
bind = $mainMod, P, global, caelestia:launcherInterrupt
bind = $mainMod, J, global, caelestia:launcherInterrupt
bind = $mainMod, left, global, caelestia:launcherInterrupt
bind = $mainMod, right, global, caelestia:launcherInterrupt
bind = $mainMod, up, global, caelestia:launcherInterrupt
bind = $mainMod, down, global, caelestia:launcherInterrupt
bind = $mainMod, 1, global, caelestia:launcherInterrupt
bind = $mainMod, 2, global, caelestia:launcherInterrupt
bind = $mainMod, 3, global, caelestia:launcherInterrupt
bind = $mainMod, 4, global, caelestia:launcherInterrupt
bind = $mainMod, 5, global, caelestia:launcherInterrupt
bind = $mainMod, 6, global, caelestia:launcherInterrupt
bind = $mainMod, 7, global, caelestia:launcherInterrupt
bind = $mainMod, 8, global, caelestia:launcherInterrupt
bind = $mainMod, 9, global, caelestia:launcherInterrupt
bind = $mainMod, 0, global, caelestia:launcherInterrupt
bind = $mainMod, S, global, caelestia:launcherInterrupt
bind = $mainMod, A, global, caelestia:launcherInterrupt
bind = $mainMod, Tab, global, caelestia:launcherInterrupt
bind = $mainMod, N, global, caelestia:launcherInterrupt
bind = $mainMod, U, global, caelestia:launcherInterrupt
bind = $mainMod, X, global, caelestia:launcherInterrupt
bind = $mainMod, L, global, caelestia:launcherInterrupt
bind = $mainMod, Print, global, caelestia:launcherInterrupt
# Meta + Left Alt -> Albert
bind = $mainMod, Alt_L, exec, albert toggle
# Meta + Space -> switch keyboard language (US <-> Bulgarian)
bind = $mainMod, Space, exec, hyprctl switchxkblayout all next
# Meta + Shift + Q -> close the window the mouse is over (focus follows mouse)
bind = $mainMod SHIFT, Q, killactive
# Meta + Q -> close ALL windows on the current workspace
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/close-workspace.sh

# --- apps / window management ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces: switch (mainMod + [0-9]) / move window (mainMod + SHIFT + [0-9])
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio + brightness (l = works while locked, e = repeats when held)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindel = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Media control routed through the caelestia shell (shows the OSD)
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

# Caelestia shell shortcuts (the shell must be running; it autostarts above)
bind = $mainMod, A, global, caelestia:nexus
bind = $mainMod, Tab, global, caelestia:showall
bind = $mainMod, N, global, caelestia:sidebar
bind = $mainMod, U, global, caelestia:utilities
bind = $mainMod, X, global, caelestia:session
bind = $mainMod, L, global, caelestia:lock
bind = $mainMod SHIFT, N, global, caelestia:clearNotifs

# Screenshots (region picker handled by the shell)
bind = , Print, global, caelestia:screenshot
bind = $mainMod, Print, global, caelestia:screenshotClip
bind = SHIFT, Print, global, caelestia:screenshotFreeze
bind = $mainMod SHIFT, Print, global, caelestia:screenshotFreezeClip


##############################
### WINDOWS AND WORKSPACES ###
##############################
# (Window rules intentionally omitted: this Hyprland 0.56.2 build rejects the
# standard `windowrule = rule, class:regex` matcher syntax. Add rules here once
# the correct syntax for this build is confirmed.)
